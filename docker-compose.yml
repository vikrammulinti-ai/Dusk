version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dusk-postgres
    environment:
      POSTGRES_DB: dusk
      POSTGRES_USER: dusk
      POSTGRES_PASSWORD: dusk
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dusk-redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: dusk-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: dusk-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://dusk:dusk@postgres:5432/dusk
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      APP_MODE: demo
      ROLE: api
      DUSK_TTL_SECONDS: 120
      VIEWER_LIST_RETENTION: 172800
      UNDO_WINDOW: 2592000
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    container_name: dusk-frontend
    environment:
      API_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  pgdata:
  minio_data:
